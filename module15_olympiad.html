<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Toolbox">
<title>Module 15: Olympiad Toolbox — Captain's Strategy Manual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-paper: #E9EDF0;
    --bg-paper-alt: #DCE3E8;
    --bg-blueprint: #0F3652;
    --bg-blueprint-dark: #0A2740;
    --line-blueprint: #BFE3F0;
    --line-blueprint-dim: #6FA6BE;
    --accent-brass: #B8834D;
    --accent-brass-dark: #8F6636;
    --accent-brass-light: #E8C89A;
    --success: #4C9A8B;
    --success-dark: #367568;
    --alert: #E0A458;
    --alert-dark: #B87B32;
    --text-ink: #1D2B33;
    --text-ink-soft: #4A5A63;
    --text-on-blueprint: #EAF6FB;
    --radius: 14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;}
  body{
    margin:0;
    background:var(--bg-paper);
    background-image:
      linear-gradient(var(--bg-paper-alt) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-paper-alt) 1px, transparent 1px);
    background-size: 28px 28px;
    font-family:'Quicksand', sans-serif;
    color:var(--text-ink);
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: contain;
  }
  h1,h2,h3,.mono{ font-family:'Space Mono', monospace; }

  .topbar{
    background:var(--bg-blueprint);
    color:var(--text-on-blueprint);
    padding:calc(14px + env(safe-area-inset-top)) 16px 10px;
    border-bottom:4px solid var(--accent-brass);
  }
  .topbar .eyebrow{ font-family:'Space Mono',monospace; font-size:11px; letter-spacing:2px; color:var(--line-blueprint-dim); text-transform:uppercase; }
  .topbar h1{ margin:2px 0 2px; font-size:20px; letter-spacing:0.5px; }
  .topbar .sub{ font-size:13px; color:var(--line-blueprint); opacity:0.85; }

  .motto{
    background:var(--accent-brass); color:#2A1B0C; text-align:center;
    font-family:'Space Mono',monospace; font-size:12.5px; font-weight:700; letter-spacing:0.5px;
    padding:7px 10px;
  }

  .stagebar{ display:flex; justify-content:space-between; gap:6px; padding:12px 14px 4px; max-width:720px; margin:0 auto; }
  .stagebtn{ flex:1; text-align:center; background:none; border:none; cursor:pointer; padding:6px 2px; font-family:'Space Mono',monospace; font-size:10px; color:var(--text-ink-soft); }
  .stagebtn .dot{ width:30px;height:30px; border-radius:50%; background:#fff; border:2.5px solid var(--bg-paper-alt); display:flex;align-items:center;justify-content:center; margin:0 auto 4px; font-size:15px; transition: all .2s; }
  .stagebtn.active .dot{ border-color:var(--accent-brass); background:var(--accent-brass-light); transform:scale(1.12); }
  .stagebtn.done .dot{ border-color:var(--success); background:var(--success); color:#fff; }
  .stagebtn.active{ color:var(--text-ink); font-weight:700; }

  main{ max-width:720px; margin:0 auto; padding:10px 14px calc(90px + env(safe-area-inset-bottom)); }
  .panel{ background:#fff; border-radius:var(--radius); padding:18px 16px; margin-bottom:14px; box-shadow:0 2px 10px rgba(15,54,82,0.08); border:1px solid #DCE3E8; }
  .panel h2{ font-size:17px; margin:0 0 4px; display:flex; align-items:center; gap:8px; }
  .panel .tag{ font-family:'Space Mono',monospace; font-size:10px; letter-spacing:1.5px; color:var(--accent-brass-dark); text-transform:uppercase; font-weight:700; margin-bottom:2px; }
  .panel p{ line-height:1.55; font-size:14.5px; color:var(--text-ink); }

  .blueprint-box{
    background:var(--bg-blueprint); color:var(--text-on-blueprint); border-radius:var(--radius); padding:16px; margin:12px 0;
    background-image: linear-gradient(var(--bg-blueprint-dark) 1px, transparent 1px), linear-gradient(90deg, var(--bg-blueprint-dark) 1px, transparent 1px);
    background-size:16px 16px;
  }

  .btn{
    font-family:'Space Mono',monospace; font-size:13px; font-weight:700; border:none; border-radius:10px; padding:11px 16px; cursor:pointer;
    background:var(--accent-brass); color:#2A1B0C; transition: transform .08s ease; touch-action:manipulation; -webkit-user-select:none; min-height:44px;
  }
  .btn:active{ transform:scale(0.96); }
  .btn:hover{ background:var(--accent-brass-dark); color:#fff; }
  .btn.ghost{ background:transparent; border:2px solid var(--accent-brass); color:var(--accent-brass-dark); }
  .btn.big{ width:100%; padding:14px; font-size:14px; }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .btnrow{ display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }

  .factorlist{ font-family:'Space Mono',monospace; font-size:13px; text-align:center; padding:10px; color:var(--text-on-blueprint); }
  .factorlist b{ color:var(--accent-brass-light); }

  .lightgrid{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin:12px 0; }
  .lightbulb{
    width:32px;height:32px; border-radius:50%; border:2.5px solid #fff;
    transition: all .3s;
  }
  .lightbulb.red{ background:var(--alert); box-shadow:0 0 8px rgba(224,164,88,0.6); }
  .lightbulb.blue{ background:var(--line-blueprint-dim); box-shadow:0 0 8px rgba(111,166,190,0.6); }

  .runningtotal{ text-align:center; font-family:'Space Mono',monospace; font-size:15px; font-weight:700; color:var(--text-on-blueprint); margin:8px 0 4px; }
  .runningtotal .lbl{ display:block; font-size:11px; color:var(--accent-brass-light); font-weight:400; }

  .rainbowlist{ display:flex; flex-direction:column; gap:6px; margin:10px 0; }
  .pairrow{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:rgba(255,255,255,0.08); border-radius:8px; padding:8px 12px;
    font-family:'Space Mono',monospace; font-size:13px; color:var(--text-on-blueprint);
    border-left:3px solid var(--accent-brass);
  }

  .verdictbox{ text-align:center; font-family:'Space Mono',monospace; font-size:14px; font-weight:700; padding:12px; border-radius:10px; margin-top:8px; }
  .verdictbox.match{ background:rgba(76,154,139,0.2); color:var(--success); }
  .verdictbox.mismatch{ background:rgba(224,164,88,0.22); color:var(--alert); }

  .rulecard{ background:var(--bg-blueprint); color:var(--text-on-blueprint); border-radius:var(--radius); padding:20px 16px; text-align:center; border:2px dashed var(--accent-brass); }
  .rulecard .big{ font-family:'Space Mono',monospace; font-size:14px; font-weight:700; line-height:1.7; }
  .rulecard .big .n{ color:var(--accent-brass-light); }
  .toolcard{ background:var(--bg-paper); border-radius:10px; padding:10px 12px; margin:6px 0; border-left:4px solid var(--accent-brass); }
  .toolcard .tname{ font-family:'Space Mono',monospace; font-weight:700; font-size:13px; color:var(--accent-brass-dark); }
  .toolcard .tdesc{ font-size:13px; color:var(--text-ink-soft); margin-top:2px; }
  .toolcard.practiced{ border-left-color:var(--success); }
  .toolcard.practiced .tname{ color:var(--success-dark); }

  .faq{ background:var(--bg-paper); border-left:4px solid var(--accent-brass); border-radius:0 10px 10px 0; padding:10px 12px; margin:10px 0; }
  .faq .q{ font-weight:700; font-size:13.5px; margin-bottom:3px; }
  .faq .a{ font-size:13.5px; color:var(--text-ink-soft); line-height:1.5; }

  .caselog{ background:#fff; border:2px solid var(--bg-paper-alt); border-radius:12px; padding:14px; margin-bottom:12px; }
  .caselog .num{ display:inline-block; background:var(--accent-brass); color:#2A1B0C; font-family:'Space Mono',monospace; font-weight:700; font-size:11px; padding:2px 8px; border-radius:6px; margin-bottom:6px; }
  .caselog p{ font-size:14px; line-height:1.5; }
  .revealstep{ background:var(--bg-paper); border-radius:8px; padding:8px 10px; margin:6px 0; font-size:13px; border-left:3px solid var(--success); }
  .bonusbox{ border:2px dashed var(--accent-brass); border-radius:12px; padding:14px; background:rgba(184,131,77,0.06); }
  .bonusbox .badge{ font-family:'Space Mono',monospace; font-size:10px; letter-spacing:1px; color:var(--accent-brass-dark); font-weight:700; }

  .finalebanner{
    background:linear-gradient(135deg, var(--bg-blueprint), var(--bg-blueprint-dark));
    color:var(--text-on-blueprint); border-radius:var(--radius); padding:20px 16px; text-align:center;
    border:2px solid var(--accent-brass); margin-top:14px;
  }
  .finalebanner .big{ font-family:'Space Mono',monospace; font-size:16px; font-weight:700; color:var(--accent-brass-light); }

  .navwrap{ position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:2px solid var(--bg-paper-alt); padding-bottom:env(safe-area-inset-bottom); }
  .navinner{ max-width:720px; margin:0 auto; padding:10px 14px; display:flex; gap:10px; }

  .showme{
    display:inline-flex; align-items:center; gap:6px; background:none; border:2px solid var(--text-ink-soft);
    border-radius:20px; padding:6px 12px; font-family:'Space Mono',monospace; font-size:11.5px; color:var(--text-ink-soft); cursor:pointer;
    touch-action:manipulation; -webkit-user-select:none; min-height:44px;
  }
  .showme:hover{ border-color:var(--accent-brass); color:var(--accent-brass-dark); }

  .step1banner{ background:var(--accent-brass-light); border-radius:10px; padding:9px 12px; font-size:12.5px; color:#5C3E1B; margin:10px 0; font-weight:600; }
</style>
</head>
<body>

<div class="topbar">
  <div class="eyebrow">RMS Design Files &middot; Captain's Bridge</div>
  <h1>🧭 Module 15: Olympiad Toolbox</h1>
  <div class="sub">Captain's Strategy Manual — the final module</div>
</div>
<div class="motto">🔧 STEP 1 BEATS PERFECTION — ONE MOVE, ONE STEP BACK, AT A TIME</div>

<div class="stagebar" id="stagebar"></div>
<main id="main"></main>

<div class="navwrap">
  <div class="navinner">
    <button class="btn ghost" id="prevBtn" onclick="prevStage()">← Back</button>
    <button class="btn big" id="nextBtn" onclick="nextStage()">Continue →</button>
  </div>
</div>

<script>
/* ================= STATE ================= */
const STAGE_LABELS = ['📖 Model','🔍 Pattern','⚙️ Rule','💡 Why','🚀 Boss'];

let memoryFallback = null;
let storageBlocked = false;
function loadState(){
  try{ const raw = localStorage.getItem('nts_m15_toolbox'); return raw ? JSON.parse(raw) : null; }
  catch(e){ storageBlocked = true; return memoryFallback; }
}
function saveState(obj){
  try{ localStorage.setItem('nts_m15_toolbox', JSON.stringify(obj)); }
  catch(e){ storageBlocked = true; memoryFallback = obj; }
}

let state = loadState() || {
  stage: 0,
  completed: [false,false,false,false,false],
  s1_lights: ['red','red','red','red','red','blue','blue','blue'],
  s1_moves: 0,
  s1_history: [],
  s2_reveal: 0,
  boss_reveal: {1:0, 2:0, 3:0},
  bonus_reveal: 0
};
function save(){ saveState(state); }

/* ================= NAV ================= */
function renderStageBar(){
  const bar = document.getElementById('stagebar');
  bar.innerHTML = STAGE_LABELS.map((label,i)=>{
    let cls = 'stagebtn';
    if(i===state.stage) cls+=' active';
    if(state.completed[i]) cls+=' done';
    return `<button class="${cls}" onclick="goStage(${i})">
      <div class="dot">${state.completed[i] ? '✓' : (i+1)}</div>${label}
    </button>`;
  }).join('');
}
function goStage(i){ state.stage = i; save(); render(); window.scrollTo(0,0); }
function nextStage(){
  state.completed[state.stage] = true;
  if(state.stage < 4){ state.stage++; save(); render(); window.scrollTo(0,0); }
  else { save(); render(); }
}
function prevStage(){ if(state.stage>0){ state.stage--; save(); render(); window.scrollTo(0,0);} }

/* ================= STAGE 1: VISUAL MODEL (INVARIANTS) ================= */
function countRed(lights){ return lights.filter(l=>l==='red').length; }
function renderStage1(){
  const lights = state.s1_lights;
  const redCount = countRed(lights);
  const canMove = state.s1_moves < 5;

  return `
  <div class="panel">
    <div class="tag">📖 Visual Model — The Signal Light Puzzle</div>
    <h2>Flip any 2 lights at once. What NEVER changes?</h2>
    <p>8 signal lights: 5 red, 3 blue. Each move, pick any 2 lights and flip BOTH to the opposite color. Watch the red count after each move — and watch its PARITY (odd or even).</p>
    <div class="blueprint-box">
      <div class="lightgrid">${lights.map(l=>`<div class="lightbulb ${l}"></div>`).join('')}</div>
      <div class="runningtotal"><span class="lbl">RED LIGHTS RIGHT NOW</span>${redCount} (${redCount%2===0?'EVEN':'ODD'})</div>
      ${state.s1_history.length ? `<div class="factorlist">History: ${state.s1_history.join(' &rarr; ')}</div>` : ''}
      ${canMove
        ? `<div class="btnrow" style="justify-content:center"><button class="btn big" onclick="flipTwo1()">🔀 Flip 2 random lights</button></div>`
        : `<div class="step1banner">🏁 The exact red count kept changing (${state.s1_history.join(', ')}) — but it was ALWAYS odd, every single time. That "always odd" property is called an INVARIANT: something that never changes, no matter what moves you make.</div>`}
    </div>
  </div>`;
}
function flipTwo1(){
  const lights = state.s1_lights;
  let i = Math.floor(Math.random()*lights.length);
  let j = Math.floor(Math.random()*lights.length);
  while(j===i) j = Math.floor(Math.random()*lights.length);
  lights[i] = lights[i]==='red' ? 'blue' : 'red';
  lights[j] = lights[j]==='red' ? 'blue' : 'red';
  state.s1_moves++;
  state.s1_history.push(countRed(lights));
  save(); render();
}

/* ================= STAGE 2: MENTAL STRATEGY (WORKING BACKWARDS) ================= */
const WB_START = 10;
const WB_HOURS = 3;
function renderStage2(){
  const r = state.s2_reveal;
  // reverse steps: undo +3, then undo /2 (multiply by 2), repeated WB_HOURS times
  const values = [WB_START];
  let v = WB_START;
  for(let i=0;i<WB_HOURS;i++){ v = (v-3)*2; values.push(v); }
  const steps = [];
  for(let i=0;i<WB_HOURS;i++){
    steps.push(`Undo hour ${WB_HOURS-i}: (${values[i]} &minus; 3) &times; 2 = ${values[i+1]}`);
  }
  const done = r >= steps.length;

  return `
  <div class="panel">
    <div class="tag">🔍 Mental Strategy — Working Backwards</div>
    <h2>A ballast tank ends with 10 liters. Where did it start?</h2>
    <p>Every hour: half the water drains, then 3 liters get added. After 3 hours, exactly 10 liters remain. Rather than guessing a starting amount and checking forward, undo each hour in REVERSE.</p>
    <div class="blueprint-box">
      <div class="rainbowlist">${Array.from({length:r}).map((_,i)=>`<div class="pairrow">${steps[i]}</div>`).join('')}</div>
      <div class="btnrow" style="justify-content:center">
        ${!done
          ? `<button class="btn big" onclick="revealS2()">🔓 Undo the next hour</button>`
          : `<div class="step1banner">🏁 Working backwards from 10, the tank must have started with ${values[WB_HOURS]} liters. Forward-checking three hours from a guess would\u2019ve taken much longer than reversing three simple steps.</div>`}
      </div>
    </div>
  </div>`;
}
function revealS2(){ state.s2_reveal++; save(); render(); }

/* ================= STAGE 3: GENERAL RULE ================= */
function renderStage3(){
  return `
  <div class="panel">
    <div class="tag">⚙️ General Rule — The Captain's Manual</div>
    <h2>Six tools every Chief Engineer should know</h2>
    <div class="rulecard">
      <div class="big">Some problems fall to searching.<br>Olympiad problems fall to<br><span class="n">CHOOSING THE RIGHT TOOL.</span></div>
    </div>
    <div class="toolcard practiced">
      <div class="tname">✓ INVARIANTS (practiced today)</div>
      <div class="tdesc">Find something that never changes through any sequence of moves — use it to prove a target is impossible.</div>
    </div>
    <div class="toolcard practiced">
      <div class="tname">✓ WORKING BACKWARDS (practiced today)</div>
      <div class="tdesc">Start from the end state and reverse each step — often faster than searching forward.</div>
    </div>
    <div class="toolcard">
      <div class="tname">PARITY (Module 10)</div>
      <div class="tdesc">The simplest invariant of all — odd/even never flips except by an odd change.</div>
    </div>
    <div class="toolcard">
      <div class="tname">EXTREME PRINCIPLE</div>
      <div class="tdesc">Look at the biggest or smallest item in a set first — it often unlocks the whole problem.</div>
    </div>
    <div class="toolcard">
      <div class="tname">CONSTRUCTIVE THINKING</div>
      <div class="tdesc">To prove something IS possible, just build one real working example.</div>
    </div>
    <div class="toolcard">
      <div class="tname">CASE-SPLITTING</div>
      <div class="tdesc">Break a big problem into a few smaller cases (like odd vs. even) and solve each separately.</div>
    </div>
  </div>`;
}

/* ================= STAGE 4: WHY IT WORKS ================= */
function renderStage4(){
  return `
  <div class="panel">
    <div class="tag">💡 Why It Works — The Proof</div>
    <h2>Why does an invariant prove impossibility?</h2>
    <p>Back in Stage 1, the red-light count kept changing — but it was ALWAYS odd. Here's why: flipping 2 lights can change the red count by only <b>&minus;2, 0, or +2</b> — never by an odd amount. Changing by an even number can never flip odd to even.</p>
    <div class="blueprint-box">
      <div class="factorlist">Start: 5 red (ODD)<br>Every move changes the count by an EVEN amount<br>Result: the count is ALWAYS odd, forever</div>
    </div>
    <p><b>Here's the proof, engineer-style:</b> "all lights the same color" means either 0 red or 8 red — both EVEN. Since the red count can only ever be ODD, it can NEVER equal an even target. That's a full impossibility proof, without testing a single sequence of moves — the same style of reasoning you used in Module 10 (lifeboats) and Module 13 (impossible cargo loads).</p>
    <div class="faq">
      <div class="q">Why does working backwards work here but not everywhere?</div>
      <div class="a">It works best when each forward step has a clean, reversible "undo" — like turning "half, then add 3" into "subtract 3, then double." If a step loses information (like rounding), reversing it isn't always possible.</div>
    </div>
    <div class="faq">
      <div class="q">Is an invariant always about parity?</div>
      <div class="a">No — parity is just the simplest kind. Other invariants involve remainders (like Module 9's modular arithmetic), totals that stay fixed, or colors/patterns that persist. The trick is always the same: find what DOESN'T change.</div>
    </div>
  </div>`;
}

/* ================= STAGE 5: COMPETITION CHALLENGE ================= */
function renderVisual(v){
  if(v.type==='list'){
    return `<div class="blueprint-box"><div class="rainbowlist">${v.rows.map(r=>`<div class="pairrow">${r}</div>`).join('')}</div></div>`;
  }
  if(v.type==='verdict'){
    return `<div class="blueprint-box"><div class="verdictbox ${v.kind==='possible'?'match':'mismatch'}">${v.text}</div></div>`;
  }
  if(v.type==='lights'){
    return `<div class="blueprint-box"><div class="lightgrid">${v.lights.map(l=>`<div class="lightbulb ${l}"></div>`).join('')}</div></div>`;
  }
  return '';
}

const BOSS_DATA = {
  1: {
    tag: 'CASE 1 · RMS TITANIC', title: "The Bridge Signal Lights",
    text: '8 bridge lights start as 5 red, 3 blue. Each minute, the crew flips any 2 lights at once. Can all 8 ever become the same color?',
    steps: [
      { text:'Step 1: The starting red count is 5 \u2014 an ODD number.', visual:{type:'lights', lights:['red','red','red','red','red','blue','blue','blue']} },
      { text:'Step 2: Flipping 2 lights always changes the red count by &minus;2, 0, or +2 \u2014 always an EVEN change. So the count stays ODD forever, no matter how many moves happen.' },
      { text:'Step 3: "All the same color" means the red count would have to be 0 or 8 \u2014 both EVEN.' },
      { text:'Answer: IMPOSSIBLE.', visual:{type:'verdict', kind:'impossible', text:'\u26A0\uFE0F The red count can never be even, so all 8 lights can never match \u2014 proven without testing a single move.'} }
    ]
  },
  2: {
    tag: "CASE 2 · SHIP'S LAB", title: 'The Reverse-Engineered Dilution',
    text: 'A mixing tank: each hour, half the solution drains, then 4 liters of fresh solution is added. After 2 hours, exactly 13 liters remain. How much was there at the start?',
    steps: [
      { text:'Step 1: Undo hour 2 \u2014 reverse "add 4" then "halve": (13 &minus; 4) &times; 2.', visual:{type:'list', rows:['(13 \u2212 4) \u00d7 2 = 18']} },
      { text:'Step 2: Undo hour 1 the same way: (18 &minus; 4) &times; 2.', visual:{type:'list', rows:['(18 \u2212 4) \u00d7 2 = 28']} },
      { text:'Answer: The tank started with 28 liters \u2014 confirmed by checking forward: 28&divide;2+4=18, then 18&divide;2+4=13. \u2713' }
    ]
  },
  3: {
    tag: 'CASE 3 · WARP PIPE WORKSHOP', title: "Mario's Block Row",
    text: 'A row of 6 blocks starts with 4 Coin Blocks and 2 Empty Blocks. Mario may flip any 2 blocks at once (Coin&harr;Empty). Can all 6 ever become Coin Blocks?',
    steps: [
      { text:'Step 1: Starting coin count is 4 \u2014 an EVEN number. Target (all 6 coins) is also EVEN.' },
      { text:'Step 2: Since the parity already matches, the invariant doesn\u2019t block it. Try flipping just the 2 Empty Blocks together.' },
      { text:'Answer: POSSIBLE \u2014 in fact, just ONE move does it!', visual:{type:'verdict', kind:'possible', text:'✅ Flip the 2 empty blocks \u2192 all 6 are now Coin Blocks. The invariant said it COULD work, and it does.'} }
    ]
  }
};
function renderBossCard(id){
  const data = BOSS_DATA[id];
  const revealed = state.boss_reveal[id];
  return `
  <div class="caselog">
    <div class="num">${data.tag}</div>
    <p><b>${data.title}</b><br>${data.text}</p>
    ${Array.from({length:revealed}).map((_,i)=>`
      <div class="revealstep">${data.steps[i].text}</div>
      ${data.steps[i].visual ? renderVisual(data.steps[i].visual) : ''}
    `).join('')}
    ${revealed < data.steps.length
      ? `<button class="showme" onclick="revealBoss(${id})">🔓 Show me the next step</button>`
      : `<div class="step1banner">✅ Case closed, Chief Engineer.</div>`}
  </div>`;
}
function revealBoss(id){ state.boss_reveal[id]++; save(); render(); }

const BONUS_STEPS = [
  "Step 1: Imagine everyone at a party shaking hands. Every handshake adds exactly 1 to TWO people's personal handshake counts (the two people shaking).",
  "Step 2: So if you add up EVERYONE's handshake count, each handshake gets counted twice \u2014 the grand total is always 2 &times; (number of handshakes), which is always EVEN.",
  "Step 3: If exactly ONE person had an odd count and everyone else had an even count, the grand total would be odd + even + even + ... = ODD. That contradicts Step 2!",
  "Answer: It's IMPOSSIBLE for exactly one person to have an odd handshake count. In ANY group, the number of people with an odd handshake count is always even \u2014 a famous result called the Handshake Lemma, and it's just another invariant, exactly like your signal lights."
];
function renderStage5(){
  return `
  <div class="panel">
    <div class="tag">🚀 Boss Level — Captain's Puzzle Log</div>
    <h2>Three cases on the Chief Engineer's desk</h2>
    <p>Try each one yourself first. Stuck? Tap "Show me the next step" — never the full answer at once. Step 1 is always enough to start.</p>
    ${renderBossCard(1)}
    ${renderBossCard(2)}
    ${renderBossCard(3)}
    <div class="bonusbox">
      <div class="badge">⭐ OPTIONAL BONUS — ONLY IF YOU WANT MORE</div>
      <p style="margin:6px 0 0"><b>The Handshake Lemma:</b> Could exactly one person at a party have shaken an odd number of hands?</p>
      ${Array.from({length:state.bonus_reveal}).map((_,i)=>`<div class="revealstep">${BONUS_STEPS[i]}</div>`).join('')}
      ${state.bonus_reveal < BONUS_STEPS.length
        ? `<button class="showme" onclick="revealBonus()">🔓 Show me the next step</button>`
        : `<div class="finalebanner">
            <div class="big">🏆 CHIEF ENGINEER — FULL SKETCHBOOK COMPLETE 🏆</div>
            <p style="margin-top:10px;font-size:13.5px">Fifteen modules, from Numbers to the Olympiad Toolbox. Every proof, every trick, every "impossible" you've solved — it all connects. Well done, Chief Engineer.</p>
          </div>`}
    </div>
  </div>`;
}
function revealBonus(){ state.bonus_reveal++; save(); render(); }

/* ================= RENDER ================= */
function render(){
  renderStageBar();
  const renderers = [renderStage1, renderStage2, renderStage3, renderStage4, renderStage5];
  let html = renderers[state.stage]();
  if(storageBlocked){
    html = `<div class="step1banner" style="background:var(--alert);color:#402A08">⚠️ Progress-saving is off in this browser mode (common when opening the file directly, or in Private Browsing). The mission still works fully — just keep this tab open to keep your place.</div>` + html;
  }
  document.getElementById('main').innerHTML = html;
  document.getElementById('prevBtn').style.visibility = state.stage===0 ? 'hidden' : 'visible';
  document.getElementById('nextBtn').textContent = state.stage===4 ? '🏁 Finish Module' : 'Continue →';
}
render();
</script>
</body>
</html>
