<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-paper: #E9EDF0;
    --bg-paper-alt: #DCE3E8;
    --bg-blueprint: #0F3652;
    --bg-blueprint-dark: #0A2740;
    --line-blueprint: #BFE3F0;
    --line-blueprint-dim: #6FA6BE;
    --accent-brass: #B8834D;
    --accent-brass-dark: #8F6636;
    --accent-brass-light: #E8C89A;
    --success: #4C9A8B;
    --success-dark: #367568;
    --alert: #E0A458;
    --alert-dark: #B87B32;
    --text-ink: #1D2B33;
    --text-ink-soft: #4A5A63;
    --text-on-blueprint: #EAF6FB;
    --radius: 14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;}
  body{
    margin:0;
    background:var(--bg-paper);
    background-image:
      linear-gradient(var(--bg-paper-alt) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-paper-alt) 1px, transparent 1px);
    background-size: 28px 28px;
    font-family:'Quicksand', sans-serif;
    color:var(--text-ink);
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: contain;
  }
  h1,h2,h3,.mono{ font-family:'Space Mono', monospace; }

  .topbar{
    background:var(--bg-blueprint);
    color:var(--text-on-blueprint);
    padding:calc(14px + env(safe-area-inset-top)) 16px 10px;
    border-bottom:4px solid var(--accent-brass);
  }
  .topbar .eyebrow{ font-family:'Space Mono',monospace; font-size:11px; letter-spacing:2px; color:var(--line-blueprint-dim); text-transform:uppercase; }
  .topbar h1{ margin:2px 0 2px; font-size:20px; letter-spacing:0.5px; }
  .topbar .sub{ font-size:13px; color:var(--line-blueprint); opacity:0.85; }

  .motto{
    background:var(--accent-brass); color:#2A1B0C; text-align:center;
    font-family:'Space Mono',monospace; font-size:12.5px; font-weight:700; letter-spacing:0.5px;
    padding:7px 10px;
  }

  .stagebar{ display:flex; justify-content:space-between; gap:6px; padding:12px 14px 4px; max-width:720px; margin:0 auto; }
  .stagebtn{ flex:1; text-align:center; background:none; border:none; cursor:pointer; padding:6px 2px; font-family:'Space Mono',monospace; font-size:10px; color:var(--text-ink-soft); }
  .stagebtn .dot{ width:30px;height:30px; border-radius:50%; background:#fff; border:2.5px solid var(--bg-paper-alt); display:flex;align-items:center;justify-content:center; margin:0 auto 4px; font-size:15px; transition: all .2s; }
  .stagebtn.active .dot{ border-color:var(--accent-brass); background:var(--accent-brass-light); transform:scale(1.12); }
  .stagebtn.done .dot{ border-color:var(--success); background:var(--success); color:#fff; }
  .stagebtn.active{ color:var(--text-ink); font-weight:700; }

  main{ max-width:720px; margin:0 auto; padding:10px 14px calc(90px + env(safe-area-inset-bottom)); }
  .panel{ background:#fff; border-radius:var(--radius); padding:18px 16px; margin-bottom:14px; box-shadow:0 2px 10px rgba(15,54,82,0.08); border:1px solid #DCE3E8; }
  .panel h2{ font-size:17px; margin:0 0 4px; display:flex; align-items:center; gap:8px; }
  .panel .tag{ font-family:'Space Mono',monospace; font-size:10px; letter-spacing:1.5px; color:var(--accent-brass-dark); text-transform:uppercase; font-weight:700; margin-bottom:2px; }
  .panel p{ line-height:1.55; font-size:14.5px; color:var(--text-ink); }

  .blueprint-box{
    background:var(--bg-blueprint); color:var(--text-on-blueprint); border-radius:var(--radius); padding:16px; margin:12px 0;
    background-image: linear-gradient(var(--bg-blueprint-dark) 1px, transparent 1px), linear-gradient(90deg, var(--bg-blueprint-dark) 1px, transparent 1px);
    background-size:16px 16px;
  }

  .btn{
    font-family:'Space Mono',monospace; font-size:13px; font-weight:700; border:none; border-radius:10px; padding:11px 16px; cursor:pointer;
    background:var(--accent-brass); color:#2A1B0C; transition: transform .08s ease; touch-action:manipulation; -webkit-user-select:none; min-height:44px;
  }
  .btn:active{ transform:scale(0.96); }
  .btn:hover{ background:var(--accent-brass-dark); color:#fff; }
  .btn.ghost{ background:transparent; border:2px solid var(--accent-brass); color:var(--accent-brass-dark); }
  .btn.big{ width:100%; padding:14px; font-size:14px; }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .btnrow{ display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }

  .numpicker{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin:10px 0; }
  .numpicker button{
    min-width:56px; height:44px; padding:0 10px; border-radius:8px; border:2px solid var(--bg-paper-alt); background:#fff;
    font-family:'Space Mono',monospace; font-weight:700; cursor:pointer; color:var(--text-ink); font-size:12.5px;
    -webkit-user-select:none; touch-action:manipulation;
  }
  .numpicker button.selected{ border-color:var(--accent-brass); background:var(--accent-brass-light); }

  .factorlist{ font-family:'Space Mono',monospace; font-size:13px; text-align:center; padding:10px; color:var(--text-on-blueprint); }
  .factorlist b{ color:var(--accent-brass-light); }

  .numstrip{ display:flex; justify-content:center; gap:6px; margin:10px 0; flex-wrap:wrap; }
  .digitchip{
    width:38px;height:44px;border-radius:8px;background:rgba(191,227,240,0.15);
    border:1.5px solid rgba(191,227,240,0.3); display:flex;align-items:center;justify-content:center;
    font-family:'Space Mono',monospace; font-size:18px; font-weight:700; color:var(--text-on-blueprint);
    transition: all .2s;
  }
  .digitchip.highlight{ background:var(--accent-brass); color:#2A1B0C; border-color:var(--accent-brass-light); transform:scale(1.08); }
  .digitchip.dim{ opacity:0.35; }
  .digitchip.final{ background:var(--success); color:#fff; border-color:#fff; }

  .roundlabel{ font-family:'Space Mono',monospace; font-size:11px; color:var(--accent-brass-light); text-align:center; margin:8px 0 2px; text-transform:uppercase; letter-spacing:1px; }

  .rainbowlist{ display:flex; flex-direction:column; gap:6px; margin:10px 0; }
  .pairrow{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:rgba(255,255,255,0.08); border-radius:8px; padding:8px 12px;
    font-family:'Space Mono',monospace; font-size:13px; color:var(--text-on-blueprint);
    border-left:3px solid var(--accent-brass);
  }

  .verdictbox{ text-align:center; font-family:'Space Mono',monospace; font-size:15px; font-weight:700; padding:12px; border-radius:10px; margin-top:8px; }
  .verdictbox.match{ background:rgba(76,154,139,0.2); color:var(--success); }
  .verdictbox.mismatch{ background:rgba(224,164,88,0.22); color:var(--alert); }

  .rulecard{ background:var(--bg-blueprint); color:var(--text-on-blueprint); border-radius:var(--radius); padding:20px 16px; text-align:center; border:2px dashed var(--accent-brass); }
  .rulecard .big{ font-family:'Space Mono',monospace; font-size:15px; font-weight:700; line-height:1.65; }
  .rulecard .big .n{ color:var(--accent-brass-light); }
  .divtable{ width:100%; border-collapse:collapse; margin-top:10px; font-size:13px; }
  .divtable td{ padding:8px 6px; border-bottom:1px solid var(--bg-paper-alt); }
  .divtable td:first-child{ font-family:'Space Mono',monospace; font-weight:700; color:var(--accent-brass-dark); width:80px; }

  .faq{ background:var(--bg-paper); border-left:4px solid var(--accent-brass); border-radius:0 10px 10px 0; padding:10px 12px; margin:10px 0; }
  .faq .q{ font-weight:700; font-size:13.5px; margin-bottom:3px; }
  .faq .a{ font-size:13.5px; color:var(--text-ink-soft); line-height:1.5; }

  .caselog{ background:#fff; border:2px solid var(--bg-paper-alt); border-radius:12px; padding:14px; margin-bottom:12px; }
  .caselog .num{ display:inline-block; background:var(--accent-brass); color:#2A1B0C; font-family:'Space Mono',monospace; font-weight:700; font-size:11px; padding:2px 8px; border-radius:6px; margin-bottom:6px; }
  .caselog p{ font-size:14px; line-height:1.5; }
  .revealstep{ background:var(--bg-paper); border-radius:8px; padding:8px 10px; margin:6px 0; font-size:13px; border-left:3px solid var(--success); }
  .bonusbox{ border:2px dashed var(--accent-brass); border-radius:12px; padding:14px; background:rgba(184,131,77,0.06); }
  .bonusbox .badge{ font-family:'Space Mono',monospace; font-size:10px; letter-spacing:1px; color:var(--accent-brass-dark); font-weight:700; }

  .navwrap{ position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:2px solid var(--bg-paper-alt); padding-bottom:env(safe-area-inset-bottom); }
  .navinner{ max-width:720px; margin:0 auto; padding:10px 14px; display:flex; gap:10px; }

  .showme{
    display:inline-flex; align-items:center; gap:6px; background:none; border:2px solid var(--text-ink-soft);
    border-radius:20px; padding:6px 12px; font-family:'Space Mono',monospace; font-size:11.5px; color:var(--text-ink-soft); cursor:pointer;
    touch-action:manipulation; -webkit-user-select:none; min-height:44px;
  }
  .showme:hover{ border-color:var(--accent-brass); color:var(--accent-brass-dark); }

  .step1banner{ background:var(--accent-brass-light); border-radius:10px; padding:9px 12px; font-size:12.5px; color:#5C3E1B; margin:10px 0; font-weight:600; }
</style>

<body>

<div class="topbar">
  <div class="eyebrow">RMS Design Files &middot; Quick-Check Instrumentation</div>
  <h1>⛽ Module 12: Digital Root</h1>
  <div class="sub">Fuel Gauge Check — a one-digit reading for any number</div>
</div>
<div class="motto">🔧 STEP 1 BEATS PERFECTION — SUM ONE ROUND AT A TIME</div>

<div class="stagebar" id="stagebar"></div>
<main id="main"></main>

<div class="navwrap">
  <div class="navinner">
    <button class="btn ghost" id="prevBtn" onclick="prevStage()">← Back</button>
    <button class="btn big" id="nextBtn" onclick="nextStage()">Continue →</button>
  </div>
</div>

<script>
/* ================= MATH HELPERS ================= */
function digitSum(n){ return String(n).split('').reduce((a,d)=>a+Number(d),0); }
function digitalRoot(n){
  if(n===0) return 0;
  let cur = n;
  while(cur > 9) cur = digitSum(cur);
  return cur;
}

/* ================= STATE ================= */
const STAGE_LABELS = ['📖 Model','🔍 Pattern','⚙️ Rule','💡 Why','🚀 Boss'];

let memoryFallback = null;
let storageBlocked = false;
function loadState(){
  try{ const raw = localStorage.getItem('nts_m12_digitalroot'); return raw ? JSON.parse(raw) : null; }
  catch(e){ storageBlocked = true; return memoryFallback; }
}
function saveState(obj){
  try{ localStorage.setItem('nts_m12_digitalroot', JSON.stringify(obj)); }
  catch(e){ storageBlocked = true; memoryFallback = obj; }
}

let state = loadState() || {
  stage: 0,
  completed: [false,false,false,false,false],
  s1_number: 9875,
  s1_rounds: [],
  s1_current: 9875,
  s1_addedInRound: 0,
  s2_problem: 0,
  s2_reveal: 0,
  boss_reveal: {1:0, 2:0, 3:0},
  bonus_reveal: 0
};
function save(){ saveState(state); }

/* ================= NAV ================= */
function renderStageBar(){
  const bar = document.getElementById('stagebar');
  bar.innerHTML = STAGE_LABELS.map((label,i)=>{
    let cls = 'stagebtn';
    if(i===state.stage) cls+=' active';
    if(state.completed[i]) cls+=' done';
    return `<button class="${cls}" onclick="goStage(${i})">
      <div class="dot">${state.completed[i] ? '✓' : (i+1)}</div>${label}
    </button>`;
  }).join('');
}
function goStage(i){ state.stage = i; save(); render(); window.scrollTo(0,0); }
function nextStage(){
  state.completed[state.stage] = true;
  if(state.stage < 4){ state.stage++; save(); render(); window.scrollTo(0,0); }
  else { save(); render(); }
}
function prevStage(){ if(state.stage>0){ state.stage--; save(); render(); window.scrollTo(0,0);} }

/* ================= STAGE 1: VISUAL MODEL (RECURSIVE DIGIT SUM) ================= */
function renderStage1(){
  const current = state.s1_current;
  const digits = String(current).split('').map(Number);
  const added = state.s1_addedInRound;
  const chips = digits.map((d,i)=>`<div class="digitchip ${i<added?'highlight':'dim'}">${d}</div>`).join('');
  const runningSum = digits.slice(0,added).reduce((a,b)=>a+b,0);
  const roundDone = added >= digits.length;
  const finalDone = roundDone && current <= 9;

  return `
  <div class="panel">
    <div class="tag">📖 Visual Model — The Fuel Gauge Reading</div>
    <h2>Sum the digits. If it's still big, sum again.</h2>
    <p>Add each digit one at a time. If the total is still two digits or more, that becomes a new round — sum it again. Keep going until only ONE digit remains.</p>
    <div class="numpicker">
      ${[9875,6273,4884,12345,999,48].map(num=>`<button class="${num===state.s1_number?'selected':''}" onclick="pickNumber1(${num})">${num}</button>`).join('')}
    </div>
    <div class="blueprint-box">
      ${state.s1_rounds.map((r,i)=>`
        <div class="roundlabel">Round ${i+1}</div>
        <div class="numstrip">${r.digits.map(d=>`<div class="digitchip highlight">${d}</div>`).join('')}</div>
        <div class="factorlist">Sum = <b>${r.sum}</b></div>
      `).join('')}
      <div class="roundlabel">Round ${state.s1_rounds.length+1}${finalDone?' (final)':''}</div>
      <div class="numstrip">${chips}</div>
      <div class="factorlist">Running total: <b>${runningSum}</b></div>
      ${!roundDone
        ? `<div class="btnrow" style="justify-content:center"><button class="btn big" onclick="addDigit1()">➕ Add next digit (${digits[added]})</button></div>`
        : (finalDone
            ? `<div class="step1banner">🏁 ${state.s1_number}'s digital root is <b>${current}</b> — a single-digit "fuel gauge reading" for the whole number.</div>`
            : `<div class="btnrow" style="justify-content:center"><button class="btn big" onclick="nextRound1()">🔁 Still two digits — sum again</button></div>`)}
    </div>
  </div>`;
}
function pickNumber1(n){
  state.s1_number = n;
  state.s1_current = n;
  state.s1_rounds = [];
  state.s1_addedInRound = 0;
  save(); render();
}
function addDigit1(){ state.s1_addedInRound++; save(); render(); }
function nextRound1(){
  const digits = String(state.s1_current).split('').map(Number);
  const sum = digits.reduce((a,b)=>a+b,0);
  state.s1_rounds.push({digits, sum});
  state.s1_current = sum;
  state.s1_addedInRound = 0;
  save(); render();
}

/* ================= STAGE 2: MENTAL STRATEGY (CASTING OUT NINES) ================= */
const CHECK_PROBLEMS = [
  { a:384, b:27, claimed:10368, label:'384 &times; 27 = 10368' },
  { a:47, b:86, claimed:4052, label:'47 &times; 86 = 4052' }
];
function renderStage2(){
  const p = CHECK_PROBLEMS[state.s2_problem];
  const dra = digitalRoot(p.a), drb = digitalRoot(p.b);
  const drProduct = digitalRoot(dra*drb);
  const drClaimed = digitalRoot(p.claimed);
  const match = drProduct === drClaimed;
  const r = state.s2_reveal;
  const steps = [
    `Digital root of ${p.a}: ${dra}`,
    `Digital root of ${p.b}: ${drb}`,
    `Multiply the digital roots: ${dra} &times; ${drb} = ${dra*drb} &rarr; digital root ${drProduct}`,
    `Digital root of the claimed answer, ${p.claimed}: ${drClaimed}`
  ];
  return `
  <div class="panel">
    <div class="tag">🔍 Mental Strategy — Casting Out Nines</div>
    <h2>Check a multiplication WITHOUT redoing it</h2>
    <p>Real engineers used this trick before calculators existed: compare digital roots instead of recomputing the whole problem. Pick a claim to check.</p>
    <div class="numpicker">
      ${CHECK_PROBLEMS.map((pr,i)=>`<button class="${i===state.s2_problem?'selected':''}" onclick="pickProblem2(${i})">${pr.label}</button>`).join('')}
    </div>
    <div class="blueprint-box">
      <div class="rainbowlist">${Array.from({length:r}).map((_,i)=>`<div class="pairrow">${steps[i]}</div>`).join('')}</div>
      <div class="btnrow" style="justify-content:center">
        ${r < steps.length
          ? `<button class="btn big" onclick="revealS2()">🔓 Show me the next step</button>`
          : `<div class="verdictbox ${match?'match':'mismatch'}">${match ? `✅ MATCH (${drProduct} = ${drClaimed}) — likely correct!` : `⚠️ MISMATCH (${drProduct} &ne; ${drClaimed}) — this answer has an error!`}</div>`}
      </div>
    </div>
  </div>`;
}
function pickProblem2(i){ state.s2_problem = i; state.s2_reveal = 0; save(); render(); }
function revealS2(){ state.s2_reveal++; save(); render(); }

/* ================= STAGE 3: GENERAL RULE ================= */
function renderStage3(){
  return `
  <div class="panel">
    <div class="tag">⚙️ General Rule — The Engineer's Method</div>
    <h2>Write it in the logbook</h2>
    <div class="rulecard">
      <div class="big">Sum the digits.<br>Still two digits or more?<br><span class="n">Sum again.</span><br>Stop at ONE digit (1&ndash;9).</div>
    </div>
    <table class="divtable">
      <tr><td>9875</td><td>&rarr; 29 &rarr; 11 &rarr; 2</td></tr>
      <tr><td>6273</td><td>&rarr; 18 &rarr; 9</td></tr>
      <tr><td>999</td><td>&rarr; 27 &rarr; 9</td></tr>
    </table>
    <div class="step1banner">🧠 Memory hook: digital root is a "fuel gauge" — one digit that gives you an instant fingerprint, without needing the full number.</div>
  </div>`;
}

/* ================= STAGE 4: WHY IT WORKS ================= */
function renderStage4(){
  return `
  <div class="panel">
    <div class="tag">💡 Why It Works — The Proof</div>
    <h2>Digital root is really just "mod 9" in disguise</h2>
    <p>Back in Module 5, you proved that summing digits never changes a number's remainder when divided by 9 — because every place value is "one more than a multiple of 9" (10=9+1, 100=99+1...). That means EVERY round of digit-summing keeps landing on the same mod-9 value.</p>
    <div class="blueprint-box">
      <div class="factorlist">9875 mod 9 = 2, and the digital root of 9875 is also 2.<br>They're the exact same fact, just reached two different ways.</div>
    </div>
    <p><b>Here's the one twist:</b> when a number is an exact multiple of 9 (mod 9 = 0), its digital root shows up as <b>9</b> instead of 0 — because the digit-summing process never actually produces a 0 unless the original number itself was 0. That's why 999's digital root is 9, not 0.</p>
    <div class="faq">
      <div class="q">Why does casting out nines catch errors?</div>
      <div class="a">If a &times; b = c is TRUE, then digitalRoot(a) &times; digitalRoot(b) must have the same digital root as c — because digital root respects multiplication, just like it respects the mod-9 relationship. If the digital roots don't match, the original calculation can't be right.</div>
    </div>
    <div class="faq">
      <div class="q">Can casting out nines PROVE an answer is correct?</div>
      <div class="a">Not quite — it can only prove an answer WRONG when the roots mismatch. A match makes an error less likely, but a rare kind of mistake (like swapping two digits by exactly 9) could slip through undetected.</div>
    </div>
  </div>`;
}

/* ================= STAGE 5: COMPETITION CHALLENGE ================= */
function renderVisual(v){
  if(v.type==='list'){
    return `<div class="blueprint-box"><div class="rainbowlist">${v.rows.map(r=>`<div class="pairrow">${r}</div>`).join('')}</div></div>`;
  }
  if(v.type==='verdict'){
    return `<div class="blueprint-box"><div class="verdictbox ${v.match?'match':'mismatch'}">${v.text}</div></div>`;
  }
  return '';
}

const BOSS_DATA = {
  1: {
    tag: 'CASE 1 · RMS TITANIC', title: 'The Rivet Count Check',
    text: 'The dockworkers calculated 384 &times; 27 = 10368 for total rivets needed. Use casting out nines to check the answer.',
    steps: [
      { text:'Step 1: Digital root of 384 (3+8+4=15 &rarr; 1+5=6) and 27 (2+7=9).', visual:{type:'list', rows:['digitalRoot(384) = 6', 'digitalRoot(27) = 9']} },
      { text:'Step 2: Multiply the roots and reduce: 6&times;9=54 &rarr; 5+4=9.', visual:{type:'list', rows:['6 &times; 9 = 54 &rarr; digital root 9']} },
      { text:'Step 3: Digital root of the claimed answer, 10368 (1+0+3+6+8=18 &rarr; 9).', visual:{type:'list', rows:['digitalRoot(10368) = 9']} },
      { text:'Answer: 9 = 9 — MATCH!', visual:{type:'verdict', match:true, text:'✅ 384 &times; 27 = 10368 checks out.'} }
    ]
  },
  2: {
    tag: "CASE 2 · SHIP'S LAB", title: 'The Dilution Error',
    text: 'An assistant recorded 47 &times; 86 = 4052 for a dilution calculation. Use casting out nines to check for errors.',
    steps: [
      { text:'Step 1: Digital root of 47 (4+7=11 &rarr; 2) and 86 (8+6=14 &rarr; 5).', visual:{type:'list', rows:['digitalRoot(47) = 2', 'digitalRoot(86) = 5']} },
      { text:'Step 2: Multiply the roots and reduce: 2&times;5=10 &rarr; 1.', visual:{type:'list', rows:['2 &times; 5 = 10 &rarr; digital root 1']} },
      { text:'Step 3: Digital root of the claimed answer, 4052 (4+0+5+2=11 &rarr; 2).', visual:{type:'list', rows:['digitalRoot(4052) = 2']} },
      { text:'Answer: 1 &ne; 2 — MISMATCH!', visual:{type:'verdict', match:false, text:'\u26A0\uFE0F Error caught! The real answer is 47&times;86=4042, not 4052 (two digits were swapped).'} }
    ]
  },
  3: {
    tag: 'CASE 3 · WARP PIPE WORKSHOP', title: "Mario's Bonus Round Rule",
    text: 'Bonus rounds only trigger on scores that are exact multiples of 9. Mario\u2019s score is 6273 \u2014 does he qualify?',
    steps: [
      { text:'Step 1: Find the digital root of 6273 (6+2+7+3=18).', visual:{type:'list', rows:['18 &rarr; 1+8 = 9']} },
      { text:'Step 2: Remember Module 5\u2019s rule \u2014 digital root 9 means the number IS divisible by 9.' },
      { text:'Answer: Digital root = 9, so 6273 is a multiple of 9 (6273&divide;9=697 exactly) \u2014 Mario\u2019s bonus round triggers!', visual:{type:'verdict', match:true, text:'✅ 6273 qualifies for the bonus round.'} }
    ]
  }
};
function renderBossCard(id){
  const data = BOSS_DATA[id];
  const revealed = state.boss_reveal[id];
  return `
  <div class="caselog">
    <div class="num">${data.tag}</div>
    <p><b>${data.title}</b><br>${data.text}</p>
    ${Array.from({length:revealed}).map((_,i)=>`
      <div class="revealstep">${data.steps[i].text}</div>
      ${data.steps[i].visual ? renderVisual(data.steps[i].visual) : ''}
    `).join('')}
    ${revealed < data.steps.length
      ? `<button class="showme" onclick="revealBoss(${id})">🔓 Show me the next step</button>`
      : `<div class="step1banner">✅ Case closed, Chief Engineer.</div>`}
  </div>`;
}
function revealBoss(id){ state.boss_reveal[id]++; save(); render(); }

const BONUS_STEPS = [
  "Step 1: Try 9 &times; 7 = 63 &rarr; digital root 6+3=9.",
  "Step 2: Try 9 &times; 123 = 1107 &rarr; digital root 1+1+0+7=9.",
  "Answer: ANY whole number times 9 always has digital root 9 \u2014 no exceptions. It's one of the most reliable patterns in all of arithmetic."
];
function renderStage5(){
  return `
  <div class="panel">
    <div class="tag">🚀 Boss Level — Captain's Puzzle Log</div>
    <h2>Three cases on the Chief Engineer's desk</h2>
    <p>Try each one yourself first. Stuck? Tap "Show me the next step" — never the full answer at once. Step 1 is always enough to start.</p>
    ${renderBossCard(1)}
    ${renderBossCard(2)}
    ${renderBossCard(3)}
    <div class="bonusbox">
      <div class="badge">⭐ OPTIONAL BONUS — ONLY IF YOU WANT MORE</div>
      <p style="margin:6px 0 0"><b>The Nine Pattern:</b> What's the digital root of ANY number multiplied by 9?</p>
      ${Array.from({length:state.bonus_reveal}).map((_,i)=>`<div class="revealstep">${BONUS_STEPS[i]}</div>`).join('')}
      ${state.bonus_reveal < BONUS_STEPS.length
        ? `<button class="showme" onclick="revealBonus()">🔓 Show me the next step</button>`
        : `<div class="step1banner">🏅 Boss Level complete — you've earned Chief Engineer status on Digital Root.</div>`}
    </div>
  </div>`;
}
function revealBonus(){ state.bonus_reveal++; save(); render(); }

/* ================= RENDER ================= */
function render(){
  renderStageBar();
  const renderers = [renderStage1, renderStage2, renderStage3, renderStage4, renderStage5];
  let html = renderers[state.stage]();
  if(storageBlocked){
    html = `<div class="step1banner" style="background:var(--alert);color:#402A08">⚠️ Progress-saving is off in this browser mode (common when opening the file directly, or in Private Browsing). The mission still works fully — just keep this tab open to keep your place.</div>` + html;
  }
  document.getElementById('main').innerHTML = html;
  document.getElementById('prevBtn').style.visibility = state.stage===0 ? 'hidden' : 'visible';
  document.getElementById('nextBtn').textContent = state.stage===4 ? '🏁 Finish Module' : 'Continue →';
}
render();
</script>
</body>
</html>
