<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GCF & LCM">
<title>Module 7: GCF & LCM — Dry Dock Rectangles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-paper: #E9EDF0;
    --bg-paper-alt: #DCE3E8;
    --bg-blueprint: #0F3652;
    --bg-blueprint-dark: #0A2740;
    --line-blueprint: #BFE3F0;
    --line-blueprint-dim: #6FA6BE;
    --accent-brass: #B8834D;
    --accent-brass-dark: #8F6636;
    --accent-brass-light: #E8C89A;
    --success: #4C9A8B;
    --success-dark: #367568;
    --alert: #E0A458;
    --alert-dark: #B87B32;
    --text-ink: #1D2B33;
    --text-ink-soft: #4A5A63;
    --text-on-blueprint: #EAF6FB;
    --radius: 14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;}
  body{
    margin:0;
    background:var(--bg-paper);
    background-image:
      linear-gradient(var(--bg-paper-alt) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-paper-alt) 1px, transparent 1px);
    background-size: 28px 28px;
    font-family:'Quicksand', sans-serif;
    color:var(--text-ink);
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: contain;
  }
  h1,h2,h3,.mono{ font-family:'Space Mono', monospace; }

  .topbar{
    background:var(--bg-blueprint);
    color:var(--text-on-blueprint);
    padding:calc(14px + env(safe-area-inset-top)) 16px 10px;
    border-bottom:4px solid var(--accent-brass);
  }
  .topbar .eyebrow{ font-family:'Space Mono',monospace; font-size:11px; letter-spacing:2px; color:var(--line-blueprint-dim); text-transform:uppercase; }
  .topbar h1{ margin:2px 0 2px; font-size:20px; letter-spacing:0.5px; }
  .topbar .sub{ font-size:13px; color:var(--line-blueprint); opacity:0.85; }

  .motto{
    background:var(--accent-brass); color:#2A1B0C; text-align:center;
    font-family:'Space Mono',monospace; font-size:12.5px; font-weight:700; letter-spacing:0.5px;
    padding:7px 10px;
  }

  .stagebar{ display:flex; justify-content:space-between; gap:6px; padding:12px 14px 4px; max-width:720px; margin:0 auto; }
  .stagebtn{ flex:1; text-align:center; background:none; border:none; cursor:pointer; padding:6px 2px; font-family:'Space Mono',monospace; font-size:10px; color:var(--text-ink-soft); }
  .stagebtn .dot{ width:30px;height:30px; border-radius:50%; background:#fff; border:2.5px solid var(--bg-paper-alt); display:flex;align-items:center;justify-content:center; margin:0 auto 4px; font-size:15px; transition: all .2s; }
  .stagebtn.active .dot{ border-color:var(--accent-brass); background:var(--accent-brass-light); transform:scale(1.12); }
  .stagebtn.done .dot{ border-color:var(--success); background:var(--success); color:#fff; }
  .stagebtn.active{ color:var(--text-ink); font-weight:700; }

  main{ max-width:720px; margin:0 auto; padding:10px 14px calc(90px + env(safe-area-inset-bottom)); }
  .panel{ background:#fff; border-radius:var(--radius); padding:18px 16px; margin-bottom:14px; box-shadow:0 2px 10px rgba(15,54,82,0.08); border:1px solid #DCE3E8; }
  .panel h2{ font-size:17px; margin:0 0 4px; display:flex; align-items:center; gap:8px; }
  .panel .tag{ font-family:'Space Mono',monospace; font-size:10px; letter-spacing:1.5px; color:var(--accent-brass-dark); text-transform:uppercase; font-weight:700; margin-bottom:2px; }
  .panel p{ line-height:1.55; font-size:14.5px; color:var(--text-ink); }

  .blueprint-box{
    background:var(--bg-blueprint); color:var(--text-on-blueprint); border-radius:var(--radius); padding:16px; margin:12px 0;
    background-image: linear-gradient(var(--bg-blueprint-dark) 1px, transparent 1px), linear-gradient(90deg, var(--bg-blueprint-dark) 1px, transparent 1px);
    background-size:16px 16px;
  }

  .btn{
    font-family:'Space Mono',monospace; font-size:13px; font-weight:700; border:none; border-radius:10px; padding:11px 16px; cursor:pointer;
    background:var(--accent-brass); color:#2A1B0C; transition: transform .08s ease; touch-action:manipulation; -webkit-user-select:none; min-height:44px;
  }
  .btn:active{ transform:scale(0.96); }
  .btn:hover{ background:var(--accent-brass-dark); color:#fff; }
  .btn.ghost{ background:transparent; border:2px solid var(--accent-brass); color:var(--accent-brass-dark); }
  .btn.big{ width:100%; padding:14px; font-size:14px; }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .btnrow{ display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }

  .numpicker{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin:10px 0; }
  .numpicker button{
    min-width:64px; height:44px; padding:0 10px; border-radius:8px; border:2px solid var(--bg-paper-alt); background:#fff;
    font-family:'Space Mono',monospace; font-weight:700; cursor:pointer; color:var(--text-ink); font-size:12.5px;
    -webkit-user-select:none; touch-action:manipulation;
  }
  .numpicker button.selected{ border-color:var(--accent-brass); background:var(--accent-brass-light); }

  .factorlist{ font-family:'Space Mono',monospace; font-size:13px; text-align:center; padding:10px; color:var(--text-on-blueprint); }
  .factorlist b{ color:var(--accent-brass-light); }

  /* Rectangle-cut bar diagram */
  .cutbar{ display:flex; height:44px; border-radius:6px; overflow:hidden; border:2px solid var(--accent-brass-light); margin:8px 0 4px; }
  .cutsquare{ background:var(--accent-brass); border-right:1px solid var(--bg-blueprint); display:flex; align-items:center; justify-content:center; font-family:'Space Mono',monospace; font-size:11px; color:#2A1B0C; font-weight:700; }
  .cutremainder{ background:var(--alert); }
  .steprow{ margin-bottom:14px; }
  .stepcaption{ font-family:'Space Mono',monospace; font-size:12px; color:var(--text-on-blueprint); text-align:center; margin-top:2px; }

  .rainbowlist{ display:flex; flex-direction:column; gap:6px; margin:10px 0; }
  .pairrow{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:rgba(255,255,255,0.08); border-radius:8px; padding:8px 12px;
    font-family:'Space Mono',monospace; font-size:13px; color:var(--text-on-blueprint);
    border-left:3px solid var(--accent-brass);
  }

  .rulecard{ background:var(--bg-blueprint); color:var(--text-on-blueprint); border-radius:var(--radius); padding:20px 16px; text-align:center; border:2px dashed var(--accent-brass); }
  .rulecard .big{ font-family:'Space Mono',monospace; font-size:15.5px; font-weight:700; line-height:1.65; }
  .rulecard .big .n{ color:var(--accent-brass-light); }
  .divtable{ width:100%; border-collapse:collapse; margin-top:10px; font-size:13px; }
  .divtable td{ padding:8px 6px; border-bottom:1px solid var(--bg-paper-alt); }
  .divtable td:first-child{ font-family:'Space Mono',monospace; font-weight:700; color:var(--accent-brass-dark); width:70px; }

  .faq{ background:var(--bg-paper); border-left:4px solid var(--accent-brass); border-radius:0 10px 10px 0; padding:10px 12px; margin:10px 0; }
  .faq .q{ font-weight:700; font-size:13.5px; margin-bottom:3px; }
  .faq .a{ font-size:13.5px; color:var(--text-ink-soft); line-height:1.5; }

  .caselog{ background:#fff; border:2px solid var(--bg-paper-alt); border-radius:12px; padding:14px; margin-bottom:12px; }
  .caselog .num{ display:inline-block; background:var(--accent-brass); color:#2A1B0C; font-family:'Space Mono',monospace; font-weight:700; font-size:11px; padding:2px 8px; border-radius:6px; margin-bottom:6px; }
  .caselog p{ font-size:14px; line-height:1.5; }
  .revealstep{ background:var(--bg-paper); border-radius:8px; padding:8px 10px; margin:6px 0; font-size:13px; border-left:3px solid var(--success); }
  .bonusbox{ border:2px dashed var(--accent-brass); border-radius:12px; padding:14px; background:rgba(184,131,77,0.06); }
  .bonusbox .badge{ font-family:'Space Mono',monospace; font-size:10px; letter-spacing:1px; color:var(--accent-brass-dark); font-weight:700; }

  .navwrap{ position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:2px solid var(--bg-paper-alt); padding-bottom:env(safe-area-inset-bottom); }
  .navinner{ max-width:720px; margin:0 auto; padding:10px 14px; display:flex; gap:10px; }

  .showme{
    display:inline-flex; align-items:center; gap:6px; background:none; border:2px solid var(--text-ink-soft);
    border-radius:20px; padding:6px 12px; font-family:'Space Mono',monospace; font-size:11.5px; color:var(--text-ink-soft); cursor:pointer;
    touch-action:manipulation; -webkit-user-select:none; min-height:44px;
  }
  .showme:hover{ border-color:var(--accent-brass); color:var(--accent-brass-dark); }

  .step1banner{ background:var(--accent-brass-light); border-radius:10px; padding:9px 12px; font-size:12.5px; color:#5C3E1B; margin:10px 0; font-weight:600; }
</style>
</head>
<body>

<div class="topbar">
  <div class="eyebrow">RMS Design Files &middot; Dry Dock Engineering Division</div>
  <h1>📐 Module 7: GCF & LCM</h1>
  <div class="sub">Dry Dock Rectangles — the biggest tile, the smallest grid</div>
</div>
<div class="motto">🔧 STEP 1 BEATS PERFECTION — CUT ONE ROUND OF SQUARES</div>

<div class="stagebar" id="stagebar"></div>
<main id="main"></main>

<div class="navwrap">
  <div class="navinner">
    <button class="btn ghost" id="prevBtn" onclick="prevStage()">← Back</button>
    <button class="btn big" id="nextBtn" onclick="nextStage()">Continue →</button>
  </div>
</div>

<script>
/* ================= MATH HELPERS ================= */
function gcdOf(a,b){ while(b!==0){ const t=b; b=a%b; a=t; } return a; }
function lcmOf(a,b){ return (a*b)/gcdOf(a,b); }

/* ================= STATE ================= */
const STAGE_LABELS = ['📖 Model','🔍 Pattern','⚙️ Rule','💡 Why','🚀 Boss'];
const PAIRS = [[48,18],[36,24],[40,16],[56,24],[45,27],[72,20]];

let memoryFallback = null;
let storageBlocked = false;
function loadState(){
  try{ const raw = localStorage.getItem('nts_m7_gcflcm'); return raw ? JSON.parse(raw) : null; }
  catch(e){ storageBlocked = true; return memoryFallback; }
}
function saveState(obj){
  try{ localStorage.setItem('nts_m7_gcflcm', JSON.stringify(obj)); }
  catch(e){ storageBlocked = true; memoryFallback = obj; }
}

let state = loadState() || {
  stage: 0,
  completed: [false,false,false,false,false],
  s1_pairIndex: 0,
  s1_a: 48,
  s1_b: 18,
  s1_steps: [],
  s1_done: false,
  s1_gcf: null,
  s2_reveal: 0,
  boss_reveal: {1:0, 2:0, 3:0},
  bonus_reveal: 0
};
function save(){ saveState(state); }

/* ================= NAV ================= */
function renderStageBar(){
  const bar = document.getElementById('stagebar');
  bar.innerHTML = STAGE_LABELS.map((label,i)=>{
    let cls = 'stagebtn';
    if(i===state.stage) cls+=' active';
    if(state.completed[i]) cls+=' done';
    return `<button class="${cls}" onclick="goStage(${i})">
      <div class="dot">${state.completed[i] ? '✓' : (i+1)}</div>${label}
    </button>`;
  }).join('');
}
function goStage(i){ state.stage = i; save(); render(); window.scrollTo(0,0); }
function nextStage(){
  state.completed[state.stage] = true;
  if(state.stage < 4){ state.stage++; save(); render(); window.scrollTo(0,0); }
  else { save(); render(); }
}
function prevStage(){ if(state.stage>0){ state.stage--; save(); render(); window.scrollTo(0,0);} }

/* ================= STAGE 1: VISUAL MODEL (RECTANGLE CUTTING) ================= */
function renderCutBar(W,H,count,remainder){
  const squarePct = (H/W)*100;
  const remPct = (remainder/W)*100;
  let bar = `<div class="cutbar">`;
  for(let i=0;i<count;i++){
    bar += `<div class="cutsquare" style="flex:0 0 ${squarePct}%">${H}&times;${H}</div>`;
  }
  if(remainder>0){
    bar += `<div class="cutsquare cutremainder" style="flex:0 0 ${remPct}%">${remainder}</div>`;
  }
  bar += `</div>`;
  const caption = remainder>0
    ? `${W} = ${count}&times;${H} + ${remainder} left over`
    : `${W} = ${count}&times;${H} exactly \u2014 no remainder!`;
  return `<div class="steprow">${bar}<div class="stepcaption">${caption}</div></div>`;
}
function renderStage1(){
  const label = `${PAIRS[state.s1_pairIndex][0]} & ${PAIRS[state.s1_pairIndex][1]}`;
  return `
  <div class="panel">
    <div class="tag">📖 Visual Model — Cutting the Dry Dock</div>
    <h2>Find the biggest square tile that fits both walls</h2>
    <p>The dry dock is ${state.s1_a}m by ${state.s1_b}m. Cut the largest possible equal squares from it. Whatever's left over becomes the new rectangle to tile. One round of cuts is Step 1 — keep going until nothing's left over.</p>
    <div class="numpicker">
      ${PAIRS.map((p,i)=>`<button class="${i===state.s1_pairIndex?'selected':''}" onclick="pickPair(${i})">${p[0]}&${p[1]}</button>`).join('')}
    </div>
    <div class="blueprint-box">
      ${state.s1_steps.map(s=>renderCutBar(s.W,s.H,s.count,s.remainder)).join('')}
      ${!state.s1_done
        ? `<div class="btnrow" style="justify-content:center"><button class="btn big" onclick="cutSquares()">🔲 Cut largest squares from ${state.s1_a}&times;${state.s1_b}</button></div>`
        : `<div class="step1banner">🏁 No remainder left! The largest square tile that fits both walls perfectly is ${state.s1_gcf}&times;${state.s1_gcf} — that's the GCF (Greatest Common Factor) of ${PAIRS[state.s1_pairIndex][0]} and ${PAIRS[state.s1_pairIndex][1]}.</div>`}
    </div>
  </div>`;
}
function pickPair(i){
  state.s1_pairIndex = i;
  state.s1_a = PAIRS[i][0];
  state.s1_b = PAIRS[i][1];
  state.s1_steps = [];
  state.s1_done = false;
  state.s1_gcf = null;
  save(); render();
}
function cutSquares(){
  const W = state.s1_a, H = state.s1_b;
  const count = Math.floor(W/H);
  const remainder = W - count*H;
  state.s1_steps.push({W,H,count,remainder});
  if(remainder === 0){
    state.s1_done = true;
    state.s1_gcf = H;
  } else {
    state.s1_a = H;
    state.s1_b = remainder;
  }
  save(); render();
}

/* ================= STAGE 2: MENTAL STRATEGY (THE SHORTCUT) ================= */
function renderStage2(){
  const [a,b] = PAIRS[state.s1_pairIndex];
  const gcf = state.s1_gcf || gcdOf(a,b);
  const product = a*b;
  const lcm = product/gcf;
  const r = state.s2_reveal;
  const steps = [
    `Multiply the two original numbers: ${a} &times; ${b} = ${product}`,
    `Divide by the GCF you already found: ${product} &divide; ${gcf} = ${lcm}`,
    `That's it — LCM(${a},${b}) = ${lcm}, with no multiple-chasing needed!`
  ];
  return `
  <div class="panel">
    <div class="tag">🔍 Mental Strategy — Skip the Multiple-Chase</div>
    <h2>You already found the GCF. The LCM is one shortcut away.</h2>
    <p>Back in Module 4, finding a common multiple meant listing multiples until two matched. There's a faster route: <b>GCF &times; LCM = a &times; b</b>. Since you already know the GCF, just rearrange it.</p>
    <div class="blueprint-box">
      <div class="rainbowlist">${Array.from({length:r}).map((_,i)=>`<div class="pairrow">${steps[i]}</div>`).join('')}</div>
      <div class="btnrow" style="justify-content:center">
        ${r < steps.length
          ? `<button class="btn big" onclick="revealS2()">🔓 Show me the next step</button>`
          : `<div class="step1banner">💡 GCF(${a},${b})=${gcf} and LCM(${a},${b})=${lcm} — and sure enough, ${gcf}&times;${lcm} = ${gcf*lcm} = ${a}&times;${b} = ${product}. They always multiply back to the original pair.</div>`}
      </div>
    </div>
  </div>`;
}
function revealS2(){ state.s2_reveal++; save(); render(); }

/* ================= STAGE 3: GENERAL RULE ================= */
function renderStage3(){
  return `
  <div class="panel">
    <div class="tag">⚙️ General Rule — The Engineer's Method</div>
    <h2>Write it in the logbook</h2>
    <div class="rulecard">
      <div class="big">GCF: cut the biggest<br>equal squares until<br>nothing's left over.<br><span class="n">GCF &times; LCM = a &times; b</span></div>
    </div>
    <table class="divtable">
      <tr><td>48 & 18</td><td>GCF=6, LCM=(48&times;18)&divide;6=144</td></tr>
      <tr><td>36 & 24</td><td>GCF=12, LCM=(36&times;24)&divide;12=72</td></tr>
      <tr><td>45 & 27</td><td>GCF=9, LCM=(45&times;27)&divide;9=135</td></tr>
    </table>
    <div class="step1banner">🧠 Memory hook: GCF shrinks — it's the biggest thing that fits INTO both numbers. LCM grows — it's the smallest thing both numbers fit INTO. They're mirror images of each other.</div>
  </div>`;
}

/* ================= STAGE 4: WHY IT WORKS ================= */
function renderStage4(){
  return `
  <div class="panel">
    <div class="tag">💡 Why It Works — The Proof</div>
    <h2>Why does GCF &times; LCM always equal a &times; b?</h2>
    <p>Think of a &times; b as the AREA of the original dry dock rectangle. The GCF is the size of the biggest square tile that covers it with no gaps. Once you know the tile size, the number of tiles along each wall is fixed — and that grid of tiles is exactly what defines the LCM: the smallest rectangle both original lengths can tile evenly.</p>
    <div class="blueprint-box">
      <div class="factorlist">48 &times; 18 = 864 total area.<br>GCF = 6 → the dock is a 8-tile &times; 3-tile grid of 6&times;6 squares.<br>That same grid, scaled out, is exactly 144 units long — the LCM.</div>
    </div>
    <p><b>Here's the proof, engineer-style:</b> every common multiple has to contain BOTH a and b as whole-number stretches. The GCF tells you the smallest "grain size" they share. Divide that grain out of the total area, and what's left is precisely the smallest shared grid — the LCM. Squeeze the tile size up, and the grid shrinks. Squeeze it down, and the grid grows. They balance perfectly, every time.</p>
    <div class="faq">
      <div class="q">Does this work with the factor-rainbow GCF method from Module 3 too?</div>
      <div class="a">Yes — however you find the GCF, the shortcut GCF &times; LCM = a &times; b always holds. The cutting method here is just a faster way to get there for larger numbers.</div>
    </div>
    <div class="faq">
      <div class="q">What if the GCF is 1?</div>
      <div class="a">Then the numbers share no common tile size at all (they're "coprime"). The shortcut still works — LCM just becomes a &times; b exactly, matching what you saw in Module 4.</div>
    </div>
  </div>`;
}

/* ================= STAGE 5: COMPETITION CHALLENGE ================= */
function renderVisual(v){
  if(v.type==='list'){
    return `<div class="blueprint-box"><div class="rainbowlist">${v.rows.map(r=>`<div class="pairrow">${r}</div>`).join('')}</div></div>`;
  }
  return '';
}

const BOSS_DATA = {
  1: {
    tag: 'CASE 1 · RMS TITANIC', title: 'The Dry Dock Tiles',
    text: 'The dry dock floor is 60m by 84m. Find the largest square tile that fits evenly, and how many tiles are needed in total.',
    steps: [
      { text:'Step 1: Cut the largest squares from 84&times;60.', visual:{type:'list', rows:['84 = 1&times;60 + 24 left over']} },
      { text:'Step 2: New rectangle is 60&times;24. Cut again.', visual:{type:'list', rows:['60 = 2&times;24 + 12 left over']} },
      { text:'Step 3: New rectangle is 24&times;12. Cut once more \u2014 no remainder!', visual:{type:'list', rows:['24 = 2&times;12 exactly']} },
      { text:'Answer: GCF = 12, so the dock uses 12&times;12 tiles. That\u2019s 5 tiles across (60&divide;12) &times; 7 tiles down (84&divide;12) = 35 tiles total.' }
    ]
  },
  2: {
    tag: "CASE 2 · SHIP'S LAB", title: 'The Vial Kits',
    text: 'A lab has 36 red vials and 24 blue vials. Make the maximum number of identical kits with none left over.',
    steps: [
      { text:'Step 1: Cut the largest squares from 36&times;24.', visual:{type:'list', rows:['36 = 1&times;24 + 12 left over']} },
      { text:'Step 2: New rectangle is 24&times;12. Cut again \u2014 no remainder!', visual:{type:'list', rows:['24 = 2&times;12 exactly']} },
      { text:'Step 3: GCF = 12 \u2014 that\u2019s the maximum number of identical kits.' },
      { text:'Answer: 12 kits, each with 3 red vials (36&divide;12) and 2 blue vials (24&divide;12).' }
    ]
  },
  3: {
    tag: 'CASE 3 · WARP PIPE WORKSHOP', title: "Mario's Block Rhythm",
    text: 'Coin blocks appear every 8 tiles, mushroom blocks every 12 tiles. Use the shortcut (not a multiple-chase!) to find where both appear together.',
    steps: [
      { text:'Step 1: Find the GCF of 8 and 12 by cutting squares from 12&times;8.', visual:{type:'list', rows:['12 = 1&times;8 + 4 left over', '8 = 2&times;4 exactly']} },
      { text:'Step 2: GCF = 4. Now use the shortcut: multiply the originals.', visual:{type:'list', rows:['8 &times; 12 = 96']} },
      { text:'Step 3: Divide by the GCF.', visual:{type:'list', rows:['96 &divide; 4 = 24']} },
      { text:'Answer: LCM(8,12) = 24 \u2014 both blocks appear together at tile 24, found without listing a single multiple by hand.' }
    ]
  }
};
function renderBossCard(id){
  const data = BOSS_DATA[id];
  const revealed = state.boss_reveal[id];
  return `
  <div class="caselog">
    <div class="num">${data.tag}</div>
    <p><b>${data.title}</b><br>${data.text}</p>
    ${Array.from({length:revealed}).map((_,i)=>`
      <div class="revealstep">${data.steps[i].text}</div>
      ${data.steps[i].visual ? renderVisual(data.steps[i].visual) : ''}
    `).join('')}
    ${revealed < data.steps.length
      ? `<button class="showme" onclick="revealBoss(${id})">🔓 Show me the next step</button>`
      : `<div class="step1banner">✅ Case closed, Chief Engineer.</div>`}
  </div>`;
}
function revealBoss(id){ state.boss_reveal[id]++; save(); render(); }

const BONUS_STEPS = [
  "Step 1: Cut squares from 252&times;105. 252 = 2&times;105 + 42 left over.",
  "Step 2: New rectangle 105&times;42. 105 = 2&times;42 + 21 left over.",
  "Step 3: New rectangle 42&times;21. 42 = 2&times;21 exactly \u2014 done!",
  "Answer: GCF(252,105) = 21, found in just THREE cuts \u2014 Euclid's trick handles huge numbers just as fast as small ones."
];
function renderStage5(){
  return `
  <div class="panel">
    <div class="tag">🚀 Boss Level — Captain's Puzzle Log</div>
    <h2>Three cases on the Chief Engineer's desk</h2>
    <p>Try each one yourself first. Stuck? Tap "Show me the next step" — never the full answer at once. Step 1 is always enough to start.</p>
    ${renderBossCard(1)}
    ${renderBossCard(2)}
    ${renderBossCard(3)}
    <div class="bonusbox">
      <div class="badge">⭐ OPTIONAL BONUS — ONLY IF YOU WANT MORE</div>
      <p style="margin:6px 0 0"><b>Big Number Challenge:</b> Find the GCF of 252 and 105 using the cutting method.</p>
      ${Array.from({length:state.bonus_reveal}).map((_,i)=>`<div class="revealstep">${BONUS_STEPS[i]}</div>`).join('')}
      ${state.bonus_reveal < BONUS_STEPS.length
        ? `<button class="showme" onclick="revealBonus()">🔓 Show me the next step</button>`
        : `<div class="step1banner">🏅 Boss Level complete — you've earned Chief Engineer status on GCF & LCM.</div>`}
    </div>
  </div>`;
}
function revealBonus(){ state.bonus_reveal++; save(); render(); }

/* ================= RENDER ================= */
function render(){
  renderStageBar();
  const renderers = [renderStage1, renderStage2, renderStage3, renderStage4, renderStage5];
  let html = renderers[state.stage]();
  if(storageBlocked){
    html = `<div class="step1banner" style="background:var(--alert);color:#402A08">⚠️ Progress-saving is off in this browser mode (common when opening the file directly, or in Private Browsing). The mission still works fully — just keep this tab open to keep your place.</div>` + html;
  }
  document.getElementById('main').innerHTML = html;
  document.getElementById('prevBtn').style.visibility = state.stage===0 ? 'hidden' : 'visible';
  document.getElementById('nextBtn').textContent = state.stage===4 ? '🏁 Finish Module' : 'Continue →';
}
render();
</script>
</body>
</html>
